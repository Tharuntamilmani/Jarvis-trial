[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - Native Windows AI Desktop Assistant (Phase 1: foundation)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "qasync>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
log_cli = false
log_cli_level = "WARNING"
